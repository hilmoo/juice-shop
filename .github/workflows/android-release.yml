name: "Android APK Release"
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  NPM_VERSION: 11.19.1
  # Server the app connects to; set the repository variable JUICE_SHOP_SERVER_URL to override
  JUICE_SHOP_SERVER_URL: ${{ vars.JUICE_SHOP_SERVER_URL || 'http://10.0.2.2:3000' }}
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Node.js 24"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: 24
      - name: "Use JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: "Install npm ${{ env.NPM_VERSION }}"
        run: npm install -g npm@${{ env.NPM_VERSION }}
      - name: "Install frontend dependencies"
        run: npm install --ignore-scripts
      - name: "Point app at Juice Shop server"
        run: |
          cat > src/environments/environment.android.ts <<EOT
          export const environment = {
            production: true,
            hostServer: '${JUICE_SHOP_SERVER_URL%/}'
          }
          EOT
      - name: "Build web assets and sync Capacitor"
        run: npm run cap:sync
      - name: "Set app version from release tag"
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/; s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
      - name: "Build release APK"
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: "Sign APK"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "juice-shop-${{ github.event.release.tag_name || github.sha }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs juice-shop-*.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - name: "Upload APK as workflow artifact"
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-apk
          path: frontend/juice-shop-*.apk
      - name: "Attach APK to release"
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 #v2.2.2
        with:
          files: frontend/juice-shop-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
